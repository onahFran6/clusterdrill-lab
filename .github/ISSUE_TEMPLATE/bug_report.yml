name: Bug report
description: Something in the Terraform module or bootstrap scripts is broken or incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - providers/aws (Terraform)
        - providers/gcp (reserved seam)
        - bootstrap (kubeadm/containerd/Cilium/clusterdrill install)
        - Documentation
        - Other/unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens? Include `terraform plan`/`apply` output, bootstrap script output, or error messages.
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
    validations:
      required: false
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version (kubeadm)
    validations:
      required: false
