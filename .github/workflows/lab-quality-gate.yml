name: Lab quality gate

# The pre-merge quality gate for this repository's Terraform root modules
# and bootstrap scripts. Every job here validates or statically scans
# Terraform source and shell scripts without applying anything or using a
# real cloud credential - a fork's pull_request run gets the same
# behavior as a trusted one.
#
# Third-party Actions below are pinned to a full commit SHA, not a
# mutable tag - the trailing `# vX` comment is only a human-readable
# label. To bump one: `gh api repos/<owner>/<repo>/git/refs/tags/<new-tag>
# --jq .object.sha`.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-fmt-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: providers/aws

      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false
        working-directory: providers/aws

      - name: terraform validate
        run: terraform validate
        working-directory: providers/aws

  terraform-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Static Terraform misconfiguration scan - reads source only, never
      # applies anything and needs no cloud credential. Trivy's `config`
      # scanner covers the same IaC-misconfiguration category the
      # now-deprecated standalone tfsec used to; using it here keeps this
      # repository's security-scanning tooling to one vendor.
      - name: Trivy Terraform config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: providers
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  bootstrap-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck bootstrap/*.sh bootstrap/lib/*.sh

  # Unit-tests lib/os-family.sh's distro-to-package-manager-family mapping
  # against synthetic /etc/os-release fixtures - a real, runnable check for
  # the one part of the RHEL-family bootstrap path that isn't proven by a
  # real cluster run (see bootstrap/README.md's "Known limitations"). Needs
  # no VM/container: detect_os_family is a pure function of whatever
  # os-release file it's pointed at.
  bootstrap-os-family-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run os-family detection unit tests
        run: bash bootstrap/check_os_family_detection.sh

  # Proves compatibility.json's contract holds for real, without any real
  # cloud spend - a real kubeadm single-node cluster, bootstrapped on this
  # runner itself (no EC2, no Terraform). runs-on is ubuntu-22.04
  # specifically, not ubuntu-latest, matching compatibility.json's own
  # documented OS support exactly rather than whatever ubuntu-latest
  # happens to alias to when this workflow runs.
  #
  # Matrixed over CLUSTERDRILL_DEPLOY's two states (see bootstrap/run.sh's
  # own usage comment) rather than one fixed flow: false proves a bare lab
  # cluster comes up cleanly with zero clusterdrill footprint (the default
  # every real lab gets today), true proves the full opt-in install - helm
  # install, the appliance reachable over its NodePort, and helm uninstall
  # cleanly tearing it back down - actually works end to end.
  app-lab-compatibility-e2e:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        clusterdrill_deploy: [false, true]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the compatibility contract matches the bootstrap scripts
        run: bash bootstrap/check_compatibility_contract.sh

      # GitHub-hosted ubuntu-22.04 runners ship ~20GB+ of large toolchains
      # this job never uses (dotnet, Haskell, Android, Swift) alongside
      # only ~10-15GB actually free - not enough headroom once kubeadm,
      # Cilium, and the appliance image are all pulled, which caused a
      # real failure here: kubelet evicted the clusterdrill-web pod for
      # ephemeral-storage pressure before it ever got to run. This is the
      # standard, widely-used GitHub Actions disk-space mitigation, not
      # something specific to this lab.
      - name: Free up disk space (unrelated preinstalled toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f 2>/dev/null || true
          df -h /

      # Run as the plain runner user, not `sudo bash ...` - these scripts
      # sudo internally only where needed (matching the real flow, where
      # the SSH login user is a non-root `ubuntu` with passwordless sudo,
      # same as this runner's own default user). Wrapping the whole
      # invocation in sudo would make $HOME resolve to /root inside the
      # script instead of this user's real home, breaking the kubeconfig
      # path control-plane.sh writes to and kubectl commands below expect.
      - name: Bootstrap this runner as a single-node cluster
        run: |
          bash bootstrap/node-common.sh
          bash bootstrap/control-plane.sh 127.0.0.1
        env:
          # This runner has no separate worker node at all, unlike a real
          # lab (which always provisions >= 1) - without this, the
          # appliance Deployment can never schedule: the control-plane's
          # default NoSchedule taint has nowhere else for it to go here.
          CLUSTERDRILL_LAB_SINGLE_NODE: "1"

      # This matrix leg's whole point - mirrors an operator running
      # `CLUSTERDRILL_DEPLOY=1 ./run.sh ...`.
      - name: Deploy the clusterdrill appliance
        if: matrix.clusterdrill_deploy
        run: bash bootstrap/deploy-appliance.sh

      - name: Deploy the Headlamp dashboard
        run: |
          cp dashboard/headlamp-manifest.yaml /tmp/headlamp-manifest.yaml
          bash bootstrap/deploy-headlamp.sh

      - name: Verify helm and kustomize are the pinned versions
        run: |
          # shellcheck disable=SC1091
          source bootstrap/lib/practice-tools.sh
          ACTUAL_HELM="$(helm version --template '{{.Version}}')"
          ACTUAL_KUSTOMIZE="$(kustomize version)"
          echo "helm:      running=${ACTUAL_HELM} pinned=${HELM_VERSION}"
          echo "kustomize: running=${ACTUAL_KUSTOMIZE} pinned=${KUSTOMIZE_VERSION}"
          test "${ACTUAL_HELM}" = "${HELM_VERSION}"
          test "${ACTUAL_KUSTOMIZE}" = "${KUSTOMIZE_VERSION}"

      # The other matrix leg's whole point - a user who never sets
      # CLUSTERDRILL_DEPLOY should get a bare, working cluster with no trace
      # of clusterdrill, not an undocumented side effect.
      - name: Verify a bare cluster has zero clusterdrill footprint
        if: ${{ !matrix.clusterdrill_deploy }}
        run: |
          if kubectl get namespace clusterdrill-system >/dev/null 2>&1; then
            echo "clusterdrill-system namespace exists but CLUSTERDRILL_DEPLOY was never set" >&2
            exit 1
          fi
          echo "bare cluster confirmed: no clusterdrill-system namespace"

      # Doesn't compare against a hand-copied digest in compatibility.json -
      # the published chart at app.chart_repository/app.version already
      # pins its own image as a values.yaml default, so this proves the
      # running Deployment matches what that exact pinned chart version
      # would render, not a second, independently-maintained copy of the
      # same fact that could silently drift from it.
      - name: Verify the deployed appliance matches what the pinned chart version renders
        if: matrix.clusterdrill_deploy
        run: |
          CONTRACT_VERSION="$(python3 -c "import json; print(json.load(open('compatibility.json'))['app']['version'])")"
          CONTRACT_CHART="$(python3 -c "import json; print(json.load(open('compatibility.json'))['app']['chart_repository'])")"
          EXPECTED_IMAGE="$(helm template clusterdrill "${CONTRACT_CHART}" --version "${CONTRACT_VERSION}" \
            --namespace clusterdrill-system --set auth.existingSecretName=clusterdrill-web-auth \
            --show-only templates/deployment.yaml | grep -E '^\s*image:' | awk '{print $2}')"
          RUNNING_IMAGE="$(kubectl -n clusterdrill-system get deployment clusterdrill-web -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "running:  ${RUNNING_IMAGE}"
          echo "expected: ${EXPECTED_IMAGE} (chart_repository@app.version's own rendered default)"
          test "${RUNNING_IMAGE}" = "${EXPECTED_IMAGE}"

      - name: Smoke test - reach the appliance through its NodePort
        if: matrix.clusterdrill_deploy
        run: |
          NODEPORT="$(kubectl -n clusterdrill-system get svc clusterdrill -o jsonpath='{.spec.ports[0].nodePort}')"
          curl -fsS --retry 5 --retry-delay 3 "http://127.0.0.1:${NODEPORT}/" > /dev/null
          echo "smoke test: appliance responded on NodePort ${NODEPORT}"

      # Proves the other half of the opt-in contract: bringing the
      # appliance back down independently of the rest of the cluster.
      # helm uninstall must remove the Deployment and the cluster-scoped
      # ClusterRole, but leave the namespace and the password Secret alone
      # (the chart never created either itself) - see the clusterdrill
      # chart's own README "Upgrade and uninstall" section.
      - name: Verify helm uninstall cleanly tears the appliance back down
        if: matrix.clusterdrill_deploy
        run: |
          helm uninstall clusterdrill --namespace clusterdrill-system
          if kubectl -n clusterdrill-system get deployment clusterdrill-web >/dev/null 2>&1; then
            echo "clusterdrill-web Deployment survived helm uninstall" >&2
            exit 1
          fi
          if kubectl get clusterrole clusterdrill-appliance >/dev/null 2>&1; then
            echo "cluster-scoped ClusterRole clusterdrill-appliance survived helm uninstall" >&2
            exit 1
          fi
          kubectl get namespace clusterdrill-system >/dev/null
          kubectl -n clusterdrill-system get secret clusterdrill-web-auth >/dev/null
          echo "helm uninstall removed the Deployment and the ClusterRole; namespace and password secret are untouched"

      - name: Verify the deployed Headlamp is the exact contracted image
        run: |
          RUNNING_IMAGE="$(kubectl -n headlamp-system get deployment headlamp -o jsonpath='{.spec.template.spec.containers[0].image}')"
          CONTRACT_IMAGE="$(python3 -c "import json; print(json.load(open('compatibility.json'))['dashboard']['image'])")"
          echo "running:  ${RUNNING_IMAGE}"
          echo "contract: ${CONTRACT_IMAGE}"
          test "${RUNNING_IMAGE}" = "${CONTRACT_IMAGE}"

      - name: Smoke test - reach Headlamp through its NodePort
        run: |
          NODEPORT="$(kubectl -n headlamp-system get svc headlamp -o jsonpath='{.spec.ports[0].nodePort}')"
          curl -fsS --retry 5 --retry-delay 3 "http://127.0.0.1:${NODEPORT}/" > /dev/null
          echo "smoke test: Headlamp responded on NodePort ${NODEPORT}"

      # This job can't be dry-run locally (it needs a real kubeadm cluster)
      # - if a step above fails, this is the only way to see why from the
      # workflow log alone.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- kubectl get nodes ---"
          kubectl get nodes -o wide || true
          echo "--- kubectl get pods -A ---"
          kubectl get pods -A -o wide || true
          echo "--- kubectl get events -A (most recent) ---"
          kubectl get events -A --sort-by=.lastTimestamp || true
          echo "--- clusterdrill-web pod describe (exact exit reason/code, events) ---"
          kubectl -n clusterdrill-system describe pods -l app.kubernetes.io/name=clusterdrill || true
          echo "--- clusterdrill-web pod logs (current) ---"
          kubectl -n clusterdrill-system logs deployment/clusterdrill-web --all-containers --tail=200 || true
          echo "--- clusterdrill-web pod logs (previous container, if it restarted) ---"
          kubectl -n clusterdrill-system logs deployment/clusterdrill-web --all-containers --previous --tail=200 || true
          echo "--- headlamp pod describe ---"
          kubectl -n headlamp-system describe pods -l app.kubernetes.io/name=headlamp || true
          echo "--- headlamp pod logs ---"
          kubectl -n headlamp-system logs deployment/headlamp --tail=200 || true
          echo "--- disk usage (a disk-pressure taint would also block scheduling) ---"
          df -h || true
          echo "--- cilium status ---"
          cilium status || true
          echo "--- containerd status ---"
          sudo systemctl status containerd --no-pager || true
          echo "--- kubelet status ---"
          sudo systemctl status kubelet --no-pager || true
